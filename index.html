<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiveTrainer VR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at center, #001a33 0%, #000a1a 100%);
      overflow: hidden;
      font-family: 'Segoe UI', Arial, sans-serif;
      height: 100vh;
    }

    canvas { display: block; }

    #overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      pointer-events: none;
      user-select: none;
    }

    .logo {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      filter: drop-shadow(0 0 20px rgba(0, 150, 255, 0.6));
    }

    .title {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #88ccff;
      margin-bottom: 0.3rem;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.5;
      letter-spacing: 0.2em;
      margin-bottom: 2.5rem;
    }

    #vr-button {
      pointer-events: all;
      padding: 0.9rem 2.5rem;
      font-size: 1.1rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: rgba(0, 80, 160, 0.6);
      color: #aaddff;
      border: 1px solid rgba(100, 180, 255, 0.4);
      border-radius: 4px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    #vr-button:hover:not(:disabled) {
      background: rgba(0, 120, 220, 0.8);
      color: #ffffff;
      border-color: rgba(150, 210, 255, 0.7);
      box-shadow: 0 0 20px rgba(0, 100, 200, 0.4);
    }

    #vr-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #status {
      margin-top: 1.2rem;
      font-size: 0.75rem;
      opacity: 0.35;
      letter-spacing: 0.15em;
    }

    .bubbles-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      bottom: -20px;
      width: 6px; height: 6px;
      background: rgba(100, 180, 255, 0.15);
      border-radius: 50%;
      animation: rise linear infinite;
    }

    @keyframes rise {
      to { transform: translateY(-110vh) translateX(20px); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- CSS bubble ambience -->
  <div class="bubbles-bg" id="bubbles-bg"></div>

  <div id="overlay">
    <div class="logo">🤿</div>
    <div class="title">DiveTrainer</div>
    <div class="subtitle">VR · Skill Training</div>
    <button id="vr-button">Enter VR</button>
    <p id="status">Quest 3 · WebXR · v0.1.0</p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="src/main.js"></script>

  <script>
    // CSS bubble background
    const bg = document.getElementById('bubbles-bg');
    for (let i = 0; i < 25; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      b.style.left = Math.random() * 100 + '%';
      b.style.width = b.style.height = (4 + Math.random() * 8) + 'px';
      b.style.animationDuration = (6 + Math.random() * 12) + 's';
      b.style.animationDelay = (Math.random() * 8) + 's';
      bg.appendChild(b);
    }
  </script>
</body>
</html>
